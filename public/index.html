<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script src="/teams-js/MicrosoftTeams.min.js"></script>
<script src="/hub-data.js"></script>
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>HCI Implementation Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* HCI ONE tokens v2.1, board look. Names as in hci-one-tokens.css; Bloom is light, Night is dark. */
:root{
  --bg1:#F4F1EC; --card:#FFFFFF; --card2:#F7F5F0; --card-brd:#E6E1D8; --pill:#F1EEE7; --ink:#141414; --muted:#7A766F; --muted2:#A39E95;
  --hero:#19B34A; --hero-deep:#0F7A33; --hero-dark:#0D3D26; --hero-fill:#0F7A33; --hero-fill-ink:#FFFFFF;
  --blue:#2F6DF6; --blue-deep:#1F47B3; --purple:#6D4FD8; --gold:#F5C400; --gold-ink:#1F1A00; --warn:#EF3A33; --warn-deep:#C4211B; --warn-fill-ink:#FFFFFF; --code-blue:#1233B8;
  --chip-pos:#DCEFE3; --chip-pos-ink:#0D3D26; --chip-caution:#FFF1B8; --chip-caution-ink:#5C4700; --chip-blocked:#FFE1DF; --chip-blocked-ink:#B3120C; --chip-info:#DFE8FF; --chip-info-ink:#1F47B3; --chip-purple:#EBE3FF; --chip-purple-ink:#4B2AB3; --chip-amber:#FFECCC; --chip-amber-ink:#8A4A00;
  --shadow:0 8px 24px rgba(20,20,20,.06); --shadow-lg:0 24px 60px rgba(20,20,20,.18);
  --r:22px; --r-sm:14px; --r-tile:12px; --r-pill:999px; --focus:#F5C400;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* aliases the page reads */
  --ground:var(--bg1); --soft:var(--card2); --line:var(--card-brd);
  --accent:var(--hero-fill); --accent-ink:var(--hero-fill-ink); --accent-soft:var(--chip-pos);
  --good:var(--hero-deep); --good-soft:var(--chip-pos); --warn-soft:var(--chip-caution); --bad:var(--warn-deep); --bad-soft:var(--chip-blocked);
  --hci:var(--chip-pos-ink); --cust:var(--chip-info-ink); --dealer:var(--chip-amber-ink); --partner:var(--chip-purple-ink); --partner-soft:var(--chip-purple);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg1:#0F1117; --card:#171A22; --card2:#1D212B; --card-brd:#2A2F3A; --pill:#222632; --ink:#F3F1EC; --muted:#A09B92; --muted2:#6F6B64;
    --hero:#2FD163; --hero-deep:#19B34A; --hero-dark:#0D3D26; --hero-fill:#19B34A; --hero-fill-ink:#04210D;
    --blue:#5B8CFF; --blue-deep:#A9C0FF; --purple:#9C86F0; --gold:#FFD21F; --warn:#FF5A52; --warn-deep:#FF5A52; --warn-fill-ink:#2B0706;
    --chip-pos:#163D2A; --chip-pos-ink:#9EE2B8; --chip-caution:#4A3D07; --chip-caution-ink:#FFE27A; --chip-blocked:#4A1512; --chip-blocked-ink:#FFB3AE; --chip-info:#1B2A55; --chip-info-ink:#A9C0FF; --chip-purple:#2F2160; --chip-purple-ink:#CBB8FF; --chip-amber:#4A2C07; --chip-amber-ink:#FFD08A;
    --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.6); --focus:#FFD21F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg1:#0F1117; --card:#171A22; --card2:#1D212B; --card-brd:#2A2F3A; --pill:#222632; --ink:#F3F1EC; --muted:#A09B92; --muted2:#6F6B64;
  --hero:#2FD163; --hero-deep:#19B34A; --hero-dark:#0D3D26; --hero-fill:#19B34A; --hero-fill-ink:#04210D;
  --blue:#5B8CFF; --blue-deep:#A9C0FF; --purple:#9C86F0; --gold:#FFD21F; --warn:#FF5A52; --warn-deep:#FF5A52; --warn-fill-ink:#2B0706;
  --chip-pos:#163D2A; --chip-pos-ink:#9EE2B8; --chip-caution:#4A3D07; --chip-caution-ink:#FFE27A; --chip-blocked:#4A1512; --chip-blocked-ink:#FFB3AE; --chip-info:#1B2A55; --chip-info-ink:#A9C0FF; --chip-purple:#2F2160; --chip-purple-ink:#CBB8FF; --chip-amber:#4A2C07; --chip-amber-ink:#FFD08A;
  --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.6); --focus:#FFD21F;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg1);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-weight:600;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:0}
/* sidebar */
.side{background:var(--card);box-shadow:var(--shadow);padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;z-index:1}
.brand{display:flex;flex-direction:column;gap:2px;padding-inline:6px}
.wordmark{font-weight:800;letter-spacing:.12em;font-size:19px;color:var(--ink);white-space:nowrap}
.wordmark b{font-weight:800;color:var(--hero-deep)}
.brand-sub{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sgroup{display:flex;flex-direction:column;gap:3px}
.sgroup>.label{padding:0 12px 6px}
.sbtn{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:8px 12px;border-radius:var(--r-pill);font-weight:700;text-align:left;color:var(--ink);width:100%}
.sbtn:hover{background:var(--pill)}
.sbtn.on{background:var(--hero-fill);color:var(--hero-fill-ink)}
.sbtn.proj.on{background:var(--chip-pos);color:var(--chip-pos-ink)}
.sbtn .count{margin-left:auto;font-size:11px;font-weight:800;padding:2px 8px;border-radius:var(--r-pill);background:var(--pill);color:var(--muted)}
.sbtn.on .count{background:rgba(255,255,255,.28);color:inherit}
.sbtn.proj.on .count{background:var(--card);color:var(--chip-pos-ink)}
.sbtn .count.bad{background:var(--chip-blocked);color:var(--chip-blocked-ink)}
.subnav{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 16px;padding-left:8px;border-left:2px solid var(--card-brd)}
.subnav .sbtn{padding:6px 12px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted2)}
.dot.on_track{background:var(--hero)}.dot.watch{background:var(--gold)}.dot.at_risk,.dot.off_track{background:var(--warn)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.ghost{width:100%;border:1.5px dashed var(--card-brd);background:transparent;border-radius:var(--r-pill);padding:9px 14px;font-weight:700;color:var(--muted);text-align:left}
.ghost:hover{border-color:var(--hero-deep);color:var(--hero-deep)}
.me-box{display:flex;flex-direction:column;gap:5px;padding:12px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--card-brd)}
.me-box input{border:0;background:var(--card);border-radius:10px;padding:8px 10px;font-weight:700;min-width:0;width:100%}
/* main */
.main{flex:1;min-height:0;overflow:auto;padding:18px 24px 24px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.top h1{font-size:28px;font-weight:800;margin:4px 0 0;text-wrap:balance;line-height:1.1;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-weight:700;margin-top:5px}
.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.viewas{display:inline-flex;align-items:center;gap:2px;background:var(--card);border-radius:var(--r-pill);padding:5px;box-shadow:var(--shadow)}
.viewas span{font-size:11px;color:var(--muted);font-weight:800;padding:0 10px;letter-spacing:.12em;text-transform:uppercase}
.seg{border:0;background:transparent;padding:7px 14px;border-radius:var(--r-pill);font-weight:700;font-size:13px;color:var(--muted)}
.seg.on{background:var(--hero-fill);color:var(--hero-fill-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-pill);min-height:40px;padding:0 18px;font-weight:800;font-size:14px;background:var(--hero-fill);color:var(--hero-fill-ink);white-space:nowrap;transition:transform .15s cubic-bezier(.2,.8,.2,1),filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.card .btn.sec,.modal .btn.sec,.pend .btn.sec{background:var(--pill);box-shadow:none}
.btn.sm{min-height:32px;padding:0 14px;font-size:12.5px}
.btn.danger{background:var(--warn-deep);color:var(--warn-fill-ink)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.banner{background:var(--chip-purple);color:var(--chip-purple-ink);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:16px;font-weight:700;font-size:13px}
.warnbox{background:var(--chip-caution);color:var(--chip-caution-ink);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:16px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.n{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:var(--r-pill);background:var(--pill);color:var(--ink);font-size:11px;letter-spacing:.08em}
.statusblock{display:flex;gap:18px;align-items:stretch}
.stat-chip{flex:none;border-radius:var(--r-tile);padding:14px 16px;min-width:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-weight:800}
.stat-chip.on_track{background:var(--chip-pos);color:var(--chip-pos-ink)}.stat-chip.watch{background:var(--chip-caution);color:var(--chip-caution-ink)}.stat-chip.at_risk,.stat-chip.off_track{background:var(--chip-blocked);color:var(--chip-blocked-ink)}.stat-chip.done{background:var(--pill);color:var(--muted)}
.stat-chip .big{font-size:22px;line-height:1}
.stat-chip small{font-size:11.5px;font-weight:700;opacity:.9}
.note{font-size:14.5px;line-height:1.55;max-width:72ch;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.kpi .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.kpi .v.bad{color:var(--warn-deep)}.kpi .v.warn{color:var(--chip-caution-ink)}
.kpi .k{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.meet .when{font-size:19px;font-weight:800}
.phases{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.ph{display:flex;flex-direction:column;gap:7px}
.ph .bar{height:9px;border-radius:var(--r-pill);background:var(--pill)}
.ph.done .bar{background:var(--hero)}.ph.cur .bar{background:var(--blue)}
.ph .nm{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.25}.ph.cur .nm{color:var(--ink);font-weight:800}
.phases-wrap{overflow-x:auto}.phases-wrap .phases{min-width:640px}
.mini{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:96px}
.mini i{height:6px;border-radius:2px;background:var(--pill)}.mini i.done{background:var(--hero)}.mini i.cur{background:var(--blue)}
/* rows: the rowc pattern */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;background:var(--card2);border:1px solid var(--card-brd);border-radius:var(--r-sm)}
.row .t{font-weight:700;cursor:pointer}.row .t:hover{color:var(--hero-deep)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.row .right{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--card-brd);background:var(--card);display:grid;place-items:center;padding:0;margin-top:1px}
.chk.on{background:var(--hero-fill);border-color:var(--hero-fill);color:var(--hero-fill-ink)}
.chk svg{width:12px;height:12px}
.done-t{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);background:var(--pill);color:var(--muted);white-space:nowrap}
.pill.hci{background:var(--chip-pos);color:var(--chip-pos-ink)}.pill.customer{background:var(--chip-info);color:var(--chip-info-ink)}.pill.dealer{background:var(--chip-amber);color:var(--chip-amber-ink)}.pill.partner{background:var(--chip-purple);color:var(--chip-purple-ink)}
.pill.bad{background:var(--chip-blocked);color:var(--chip-blocked-ink)}.pill.warn{background:var(--chip-caution);color:var(--chip-caution-ink)}.pill.good{background:var(--chip-pos);color:var(--chip-pos-ink)}
.pill.int{background:var(--ink);color:var(--bg1)}.pill.ex{background:transparent;box-shadow:inset 0 0 0 1.5px var(--card-brd)}
.pill.proj{background:var(--card);box-shadow:var(--shadow);color:var(--ink);cursor:pointer;text-transform:none;letter-spacing:.01em;font-weight:700}
.pill .mono{text-transform:none;letter-spacing:0}
.cnt{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--muted);padding:3px 8px;border-radius:var(--r-pill);background:var(--pill)}
.cnt svg{width:12px;height:12px}
.who{font-size:12.5px;color:var(--muted);font-weight:700}
.due{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.due.over{color:var(--warn-deep)}
.phase-h{display:flex;align-items:center;gap:10px;margin:22px 0 8px}.phase-h:first-child{margin-top:0}
.phase-h h3{margin:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;align-items:center}
.fchip{border:0;border-radius:var(--r-pill);padding:7px 14px;font-weight:800;font-size:12px;background:var(--card);color:var(--muted);box-shadow:var(--shadow)}
.fchip.on{background:var(--hero-fill);color:var(--hero-fill-ink);box-shadow:none}
.push{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-weight:700;padding:18px 4px;font-size:15px}
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:left;padding:8px 10px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--card-brd);vertical-align:top;font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
tr.grp td{background:var(--card2);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:0}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.masked{color:var(--muted2);font-style:italic;font-size:12px}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.icard{background:var(--card2);border:1px solid var(--card-brd);border-radius:var(--r-sm);padding:18px;display:flex;flex-direction:column;gap:9px;cursor:pointer}
.card .icard,.icard.flat{background:var(--card2)}
.icards>.icard{background:var(--card);border:0;box-shadow:var(--shadow);border-radius:var(--r)}
.card .icards>.icard{background:var(--card2);border:1px solid var(--card-brd);box-shadow:none;border-radius:var(--r-sm)}
.icard:hover{outline:2px solid var(--hero-deep);outline-offset:0}
.icard.flat{cursor:default}.icard.flat:hover{outline:0}
.icard .sys{font-weight:800;font-size:17px}
.icard p{margin:0;font-size:13.5px;line-height:1.5;font-weight:600}
.icard .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.pend{background:var(--chip-caution);color:var(--chip-caution-ink);border-radius:var(--r-sm);padding:16px;display:flex;flex-direction:column;gap:10px}
.pend + .pend{margin-top:10px}
.pend .q{font-weight:800;font-size:15px}
.pend .df{font-size:13px;font-weight:700}
.pend .who,.pend .due{color:inherit;opacity:.85}
.pend .ans{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.pend textarea,.pend input{border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;min-width:0;width:100%;font-weight:600}
.pend textarea{min-height:56px;resize:vertical;grid-column:span 2}
.pend .quick{display:flex;flex-wrap:wrap;gap:6px}
.qbtn{border:0;border-radius:var(--r-pill);padding:6px 12px;font-size:12px;font-weight:800;background:var(--card);color:var(--ink)}
.qbtn:hover{filter:brightness(.97)}
.mtg{border-top:1px solid var(--card-brd);padding:16px 4px;cursor:pointer}.mtg:first-child{border-top:0;padding-top:4px}
.mtg .mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mtg .mt{font-weight:800;font-size:15px}
.mtg .body{margin-top:6px;font-size:13.5px;line-height:1.55;max-width:80ch;white-space:pre-wrap;font-weight:600}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shot{display:flex;flex-direction:column;gap:6px;cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
.shot img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r-tile);background:var(--card2);display:block;max-width:100%}
.shot span{font-size:12px;font-weight:700;color:var(--muted)}
/* conversation */
.thread{display:flex;flex-direction:column;gap:8px}
.cmt{background:var(--card2);border:1px solid var(--card-brd);border-radius:var(--r-sm);padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.cmt.mine{background:var(--chip-pos);border-color:transparent;color:var(--chip-pos-ink)}
.cmt .by{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:800}
.cmt .at{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.cmt.mine .at{color:inherit;opacity:.75}
.cmt .txt{font-size:14px;line-height:1.5;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:10px}
.composer textarea{grid-column:span 2;border:1px solid var(--card-brd);background:var(--card);border-radius:12px;padding:10px 12px;min-height:60px;resize:vertical;width:100%;font-weight:600}
.composer .opts{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
.feed{display:flex;flex-direction:column;gap:10px}
.fitem{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 14px;background:var(--card2);border:1px solid var(--card-brd);border-radius:var(--r-sm)}

function render(){

  if(S.locked&&S.role!=="hci"){S.scope="project";if(!P())S.pid=(S.cols.projects[0]||{}).id||null;if(!P()){renderSide();$("#main").innerHTML='<div class="loading">You are not on a project team yet. Ask HCI to add you to the project.</div>';return}}
  if(S.scope==="project"&&!P()){S.scope="portfolio";S.view="portfolio"}
  if(S.scope==="project"&&LEGACY[S.view]){const [v,sub]=LEGACY[S.view];if(sub)S.sub[v]=sub;S.view=v}
  if(S.scope==="project"&&!allowed().includes(S.view))S.view="overview";
  renderSide();
  const main=$("#main");
  const FILL={overview:1,plan:1,decisions:1,portfolio:1,designs:1};
  main.classList.toggle("fill",!!FILL[S.view]&&S.scope!=="admin");
  if(S.scope==="portfolio"){main.innerHTML=PORT[S.view]?PORT[S.view]():PORT.portfolio();return}
  if(S.scope==="admin"){main.innerHTML=ADMIN[S.view]?ADMIN[S.view]():ADMIN.catalog();return}
  const p=P();
  const banner=S.role!=="hci"&&!S.locked?`<div class="banner">Previewing the ${PARTIES[S.role].toLowerCase()} portal. ${S.role==="partner"?"Partners see only their own tasks, integrations and the project team.":S.role==="dealer"?"Dealers see project work without IP addresses, MACs, remote access or HCI only notes.":"Customers see everything marked for the whole project; HCI only items are hidden."}</div>`:"";

}

  let selId=S.dzsel&&all.some(d=>d.id===S.dzsel)?S.dzsel:(latest(apps.find(a=>latest(a)))||{}).id;

/* audit trail: every create, change and delete, with who and what changed */
const AUDIT_SKIP=new Set(["audit","comments"]);
const SKIPF=new Set(["updatedAt","createdAt","history","order"]);
function titleOf(col,d){d=d||{};return col==="tasks"?d.title:col==="decisions"?d.question:col==="interfaces"?d.system:col==="devices"?"Room "+(d.room||"")+" "+(DEVTYPES[d.type]||d.type||""):col==="meetings"?d.title:col==="components"?(catOf(d).name||d.catalogId||"Component"):col==="projects"?d.name:(col==="releases"||col==="deployments")?(d.app||"")+" "+(d.version||""):col==="shots"?"Screenshot"+(d.caption?" · "+d.caption:""):col==="template"?d.title:d.name||col}
function diffDocs(a,b){const out=[];const keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);for(const k of keys){if(SKIPF.has(k))continue;const x=a?a[k]:undefined,y=b?b[k]:undefined;if(JSON.stringify(x??"")!==JSON.stringify(y??""))out.push({field:k,from:x??"",to:y??""})}return out}
async function logAudit(col,id,action,before,after,note){
  if(window.HUB_SERVER_AUDIT||AUDIT_SKIP.has(col)||!S.db)return;
  const doc=after||before||{};const pid=doc.projectId||(col==="projects"?id:"");
  const changes=action==="update"?diffDocs(before,after):[];
  if(action==="update"&&!changes.length&&!note)return;
  const entry={projectId:pid,col,docId:id,action,by:S.me||"",at:now(),title:titleOf(col,doc),changes:changes.slice(0,40),note:note||""};
  try{const r=await S.db.collection("audit").add(entry);if(!S.cols.audit.some(x=>x.id===r.id))S.cols.audit.push(Object.assign({id:r.id},entry))}catch(e){console.warn("audit",e)}
}
const strip=d=>{if(!d)return null;const b=Object.assign({},d);delete b.id;return b};
async function setDoc(col,id,data,note){const before=strip(byId(col,id));await S.db.collection(col).doc(id).set(data);await logAudit(col,id,before?"update":"create",before,data,note)}
async function addDoc(col,data,note){const r=await S.db.collection(col).add(data);await logAudit(col,r.id,"create",null,data,note);return r}
async function delDoc(col,id,note){const before=strip(byId(col,id));await S.db.collection(col).doc(id).delete();await logAudit(col,id,"delete",before,null,note)}
function chg(v){if(v===""||v==null)return '<span class="masked">empty</span>';if(typeof v==="object")v=Object.entries(v).map(([k,x])=>k+" "+x).join(", ")||"empty";v=String(v);if(v.length>90)v=v.slice(0,90)+"…";return esc(v)}
function fieldLabel(col,k){const f=(FORMS[col]||[]).find(x=>x[0]===k);return f?f[1]:k==="apps"?"Installed apps":k==="pending"?"Status":k==="answer"?"Decision":k==="projectId"?"Project":k}
function fmtVal(col,k,v){if(k==="phase"&&typeof v==="number")return PHASES[v]||v;if(k==="pending")return v?"Waiting for an answer":"Decided";const f=(FORMS[col]||[]).find(x=>x[0]===k);if(f&&f[2]==="select"&&f[5]&&!Array.isArray(f[5])&&typeof f[5]==="object"&&f[5][String(v)])return f[5][String(v)];if(k==="catalogId")return (byId("catalog",v)||{}).name||v;return v}

const FIC={comment:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",decision:"M20 6L9 17l-5-5",task:"M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M12 6a6 6 0 1 0 0 12a6 6 0 1 0 0-12M12 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4",shot:"M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8.5 7a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3M21 15l-5-5L5 21",deploy:"M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15",meeting:"M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM16 2v4M8 2v4M3 10h18"};
function fdt(iso){if(!iso)return "";const d=new Date(iso);if(isNaN(d))return esc(iso);return d.toLocaleDateString("en-US",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
function recTitle(type,id){const r=byId(type,id);if(type==="projects")return "Project";if(!r)return "(removed)";
  return type==="tasks"?r.title:type==="decisions"?r.question:type==="interfaces"?r.system:type==="devices"?"Room "+(r.room||"")+" "+(DEVTYPES[r.type]||""):type==="meetings"?r.title:type==="components"?(catOf(r).name||"Component"):r.name||type}
function canSeeComment(c){
  if(S.role==="hci")return true;if(c.visibility==="internal")return false;
  if(c.recordType==="projects")return S.role!=="partner";
  const r=byId(c.recordType,c.recordId);if(!r)return false;
  if(S.role==="partner")return (c.recordType==="tasks"&&r.party==="partner")||c.recordType==="interfaces";
  if(r.visibility==="internal")return false;
  if(S.role==="dealer"&&(c.recordType==="access"||c.recordType==="network"))return false;
  return true;
}
const threadOf=(type,id)=>S.cols.comments.filter(c=>c.recordType===type&&c.recordId===id&&canSeeComment(c)).sort((a,b)=>(a.at||"").localeCompare(b.at||""));
const cntPill=(type,id)=>{const n=threadOf(type,id).length;return n?`<span class="cnt">${BUBBLE}${n}</span>`:""};

async function postComment(type,id){
  const ta=$("#cmtText");const text=(ta?.value||"").trim();if(!text){toast("Write something first");return}
  if(!S.me){toast("Put your name in the sidebar first");const m=$("#meIn");if(m)m.focus();return}
  const rec=type==="projects"?null:byId(type,id);
  const internal=!!($("#cmtInt")?.checked)||!!(rec&&rec.visibility==="internal");
  const doc={projectId:rec?rec.projectId:(type==="projects"?id:S.pid),recordType:type,recordId:id,text,by:S.me,at:now(),visibility:internal?"internal":"external"};

function feedItems(pid,withP){
  const out=[];const push=o=>{o.pid=pid;o.withP=withP;out.push(o)};
  S.cols.comments.filter(c=>c.projectId===pid&&canSeeComment(c)).forEach(c=>push({kind:"comment",label:c.recordType==="projects"?"Update":"Comment",at:c.at,by:c.by,text:c.text,type:c.recordType,id:c.recordId,internal:c.visibility==="internal"}));
  ofP("decisions",pid).filter(d=>canSee(d,"decisions")&&S.role!=="partner").forEach(d=>(d.history||[]).forEach(h=>push({kind:"decision",label:h.what==="Question asked"?"Question":"Decision",at:h.at,by:h.by,type:"decisions",id:d.id,html:h.what==="Question asked"?esc(d.question):`<b>${esc(d.question)}</b> · ${esc(d.answer||h.what.replace(/^Decided: /,""))}`,internal:d.visibility==="internal"})));
  ofP("tasks",pid).filter(t=>t.status==="done"&&t.updatedAt&&canSee(t,"tasks")).forEach(t=>push({kind:"task",label:"Done",at:t.updatedAt,by:t.owner,type:"tasks",id:t.id,text:"Marked done"+(t.note?" · "+t.note:""),internal:t.visibility==="internal"}));
  if(S.role!=="partner"){
    ofP("shots",pid).forEach(s=>push({kind:"shot",label:"Screenshot",at:s.takenAt,by:s.by,type:"devices",id:s.deviceId,text:s.caption||"",img:shotSrc(s),shotId:s.id}));
    ofP("deployments",pid).forEach(x=>push({kind:"deploy",label:x.rolledBack?"Rolled back":"Deployed",at:x.createdAt||x.date,by:x.by,text:`${x.app} ${x.version} on ${x.targets}`}));

function csvParse(txt){const rows=[];let r=[],c="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}

  .catch(e=>{DOCS[pid]={err:e.message||"Could not load documents",setup:!!e.setup,files:null};if(S.pid===pid&&S.view==="files")render()})}
const PREVIEWABLE=/\.(pdf|docx?|xlsx?|pptx?|png|jpe?g|gif|txt|csv|rtf|odt|ods|odp|vsdx?|html?|msg|eml)$/i;
function docViewer(p,x){const t=DOCTYPE[x.type];const can=PREVIEWABLE.test(x.name);
  if(can&&!S.dview){S.dview={id:x.id,url:"",loading:true};window.HUB_FILES.preview(p.id,x.id).then(j=>{if(S.dview&&S.dview.id===x.id){S.dview={id:x.id,url:j.url};render()}}).catch(e=>{if(S.dview&&S.dview.id===x.id){S.dview={id:x.id,err:e.message};render()}})}
  const v=S.dview||{};
  return `<section class="card docv" id="docview"><div class="card-h"><span class="label">${t?t[0]+" "+t[1]+" · ":""}${esc(t?x.desc:x.name)}${x.version?" · v"+esc(x.version):""}</span><span class="push"><button class="btn sec sm" data-dact="download" data-id="${esc(x.id)}">Download</button>${S.role==="hci"&&x.webUrl?`<a class="btn sec sm" href="${esc(x.webUrl)}" target="_blank" rel="noopener">Open in SharePoint</a>`:""}<button class="btn sec sm" data-dact="close">Close</button></span></div>
  ${!can?`<div class="empty">No preview for this kind of file${/\.apk$/i.test(x.name)?" (an Android app build)":""}. Download it to use it.</div>`:v.err?`<div class="empty">${esc(v.err)}</div>`:v.url?`<iframe src="${esc(v.url)}" title="${esc(x.name)}" allowfullscreen></iframe>`:'<div class="empty">Opening…</div>'}
  <div class="who" style="margin-top:8px;overflow-wrap:anywhere">${esc(x.name)}</div></section>`}
function docNextVer(st,type,desc){const code=st.fileCode;let m=0;(st.files||[]).forEach(x=>{if(x.type===type&&x.customer===code&&x.desc.toLowerCase()===desc.toLowerCase())m=Math.max(m,parseInt(x.version,10)||0)});return m+1}
function docHelp(st){const code=st.fileCode||"CUSTOMER";
  return `<div class="dhelp" role="dialog" aria-label="How files are named"><div class="card-h"><span class="label">How files are named</span><button class="btn sec sm" data-dact="help">Close</button></div>
  <div class="mono dhex">##_CODE_${esc(code)}_Description_vN_YYYYMMDD.ext</div>
  <p class="who" style="margin:8px 0 12px">Every document sits in one list. The number puts it in project order, the code says what kind of document it is, then the customer, a short description, the version and the date. The Hub names uploads for you, so you only pick the type and type a description.</p>
  <div class="dhgrid">${DOCTYPES.map(t=>`<span class="pill">${t[0]} ${t[1]}</span><span>${esc(t[2])}</span>`).join("")}</div>
  <div class="who" style="margin-top:12px">Example: <b class="mono">03_INT_${esc(code)}_Epic ADT interface spec_v2_20260925.pdf</b>. Upload the same description again and it becomes v3.</div></div>`}
function docCleanDesc(s){return String(s||"").replace(/[\\/:*?"<>|#%_]+/g," ").replace(/\s+/g," ").trim().slice(0,90)}
function docUploadForm(p,st){const types=DOCTYPES.filter(t=>docVisible(t[0]));
  return `<section class="card" id="docup" style="margin-bottom:16px"><div class="card-h"><span class="label">Add a document</span><button class="btn sec sm" data-dact="cancel">Cancel</button></div>
  <div class="fgrid"><div class="field"><label for="dupType">Type</label><select id="dupType">${types.map(t=>`<option value="${t[0]}">${t[0]} ${t[1]} · ${esc(t[2])}</option>`).join("")}</select></div>
  <div class="field"><label for="dupDesc">Short description</label><input id="dupDesc" placeholder="Epic ADT interface spec" maxlength="90"></div>
  <div class="field"><label for="dupFile">File</label><input id="dupFile" type="file"></div>
  <div class="field"><label for="dupVer">Version (optional)</label><input id="dupVer" placeholder="Next version automatically" maxlength="16"></div></div>
  <div class="hint">Saved as <b id="dupName">choose a file</b></div><div style="margin-top:12px;display:flex;gap:10px;align-items:center"><button class="btn" data-dact="upload">Upload</button><span class="who" id="dupProg"></span></div></section>`}
function docNamePreview(){const st=DOCS[S.pid];if(!st||!$("#dupName"))return;const t=DOCTYPE[$("#dupType").value];const d=docCleanDesc($("#dupDesc").value);const f=$("#dupFile").files[0];const ext=f?((/\.[A-Za-z0-9]{1,8}$/.exec(f.name)||[""])[0].toLowerCase()):"";const v=($("#dupVer").value||"").replace(/[^0-9.]/g,"")||docNextVer(st,t[0],d);
  $("#dupName").textContent=d?`${t[0]}_${t[1]}_${st.fileCode}_${d}_v${v}_${docStamp()}${ext}`:"add a short description"}
function docRenameForm(x,st){return `<div class="fgrid" style="margin-top:10px" data-stop="1"><div class="field"><label>Type</label><select id="renType">${DOCTYPES.map(t=>`<option value="${t[0]}">${t[0]} ${t[1]}</option>`).join("")}</select></div><div class="field"><label>Short description</label><input id="renDesc" value="${esc(docCleanDesc(x.name.replace(/\.[^.]+$/,"")))}" maxlength="90"></div><div class="field"><label>Version</label><input id="renVer" value="1" maxlength="16"></div><div class="field"><label>&nbsp;</label><span><button class="btn sm" data-dact="dorename" data-id="${esc(x.id)}">Rename</button> <button class="btn sec sm" data-dact="cancelren">Cancel</button></span></div></div>`}
function saveBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-doc],[data-dfilter],[data-dact]");if(!t)return;
  if(e.target.closest("[data-stop]")&&!t.dataset.dact)return;
  const pid=S.pid;const st=DOCS[pid]||{};
  if(t.dataset.dfilter){S.dfilter=t.dataset.dfilter;render();return}
  if(t.dataset.doc){if(e.target.closest("button,input,select,a"))return;S.dsel=S.dsel===t.dataset.doc?null:t.dataset.doc;S.dview=null;render();const v=$("#docview");if(v&&innerWidth<=1100)v.scrollIntoView({behavior:"smooth",block:"start"});return}
  const a=t.dataset.dact,id=t.dataset.id;
  if(a==="close"){S.dsel=null;S.dview=null;render();return}
  if(a==="help"){S.dhelp=!S.dhelp;render();return}
  if(a==="add"){S.dup=true;render();setTimeout(()=>{docNamePreview();const d=$("#dupDesc");if(d)d.focus()},0);return}
  if(a==="cancel"){S.dup=false;render();return}
  if(a==="rename"){S.dren=id;render();return}
  if(a==="cancelren"){S.dren=null;render();return}
  if(a==="download"){const x=(st.files||[]).find(f=>f.id===id);toast("Downloading…");window.HUB_FILES.download(pid,id).then(j=>{const a=document.createElement("a");a.href=j.url;a.download=x?x.name:"";a.rel="noopener";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),2000)}).catch(err=>toast("Download failed: "+err.message));return}
  if(a==="dorename"){const body={type:$("#renType").value,desc:docCleanDesc($("#renDesc").value),version:$("#renVer").value};if(!body.desc){toast("Add a description");return}
    t.disabled=true;window.HUB_FILES.rename(pid,id,body).then(j=>{toast("Renamed to "+j.file.name);S.dren=null;DOCS[pid].stale=true;loadDocs(pid)}).catch(err=>{t.disabled=false;toast("Not renamed: "+err.message)});return}
  if(a==="upload"){const f=$("#dupFile").files[0];const type=$("#dupType").value;const desc=docCleanDesc($("#dupDesc").value);
    if(!f){toast("Choose a file");return}if(!desc){toast("Add a short description");return}
    t.disabled=true;const prog=$("#dupProg");
    window.HUB_FILES.upload(pid,f,type,desc,($("#dupVer").value||"").replace(/[^0-9.]/g,""),r=>{if(prog)prog.textContent=Math.round(r*100)+"%"}).then(j=>{toast("Saved as "+j.file.name);S.dup=false;S.dsel=j.file.id;S.dview=null;DOCS[pid].stale=true;loadDocs(pid)}).catch(err=>{t.disabled=false;if(prog)prog.textContent="";toast(err.message)});return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="dq"){const q=e.target.value.trim().toLowerCase();document.querySelectorAll("table.docs tbody tr[data-text]").forEach(r=>{r.style.display=!q||r.dataset.text.includes(q)?"":"none"});return}
  if(e.target.closest&&e.target.closest("#docup"))docNamePreview();
});
document.addEventListener("change",e=>{if(e.target.closest&&e.target.closest("#docup"))docNamePreview()});


/* designs: working HTML prototypes, stored and served by the Hub server */
function designUploadForm(p,app){const htmls=((DOCS[p.id]||{}).files||[]).filter(f=>/\.html?$/i.test(f.name));if(!DOCS[p.id]&&window.HUB_FILES)loadDocs(p.id);
  return `<section class="card" id="dzup" style="margin-bottom:16px"><div class="card-h"><span class="label">Add a prototype</span><button class="btn sec sm" data-dzact="cancel">Cancel</button></div>
  <div class="fgrid"><div class="field"><label for="dzApp">App</label><select id="dzApp">${APPS.map(a=>`<option ${a===app?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
  <div class="field"><label for="dzName">Title</label><input id="dzName" placeholder="Landscape door sign, Ball Blue" maxlength="80"></div>
  <div class="field"><label for="dzFile">HTML file from your computer</label><input id="dzFile" type="file" accept=".html,.htm,text/html"></div>
  <div class="field"><label for="dzDoc">Or a file already in Documents</label><select id="dzDoc"><option value="">None</option>${htmls.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join("")}</select></div>
  <div class="field full"><label for="dzNotes">What changed</label><input id="dzNotes" maxlength="200"></div></div>
  <div style="margin-top:12px;display:flex;gap:10px;align-items:center"><button class="btn" data-dzact="save">Save prototype</button><span class="who" id="dzProg"></span></div></section>`}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-dz],[data-dzact]");if(!t)return;
  if(t.dataset.dz){S.dzsel=t.dataset.dz;render();return}
  const a=t.dataset.dzact;const p=P();if(!p)return;
  if(a==="add"){S.dzup=t.dataset.app||APPS[0];render();return}
  if(a==="cancel"){S.dzup=null;render();return}
  if(a==="save"){const app=$("#dzApp").value,name=($("#dzName").value||"").trim()||app,notes=($("#dzNotes").value||"").trim();const f=$("#dzFile").files[0],doc=$("#dzDoc").value;
    if(!f&&!doc){toast("Choose an HTML file or a document");return}
    t.disabled=true;$("#dzProg").textContent="Saving…";
    try{
      const r=f?await fetch("/api/design-file",{method:"POST",headers:{"Content-Type":"text/html"},body:await f.text()}):await fetch("/api/design-file/from-doc/"+encodeURIComponent(p.id)+"/"+encodeURIComponent(doc),{method:"POST"});
      const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);
      const prev=S.cols.designs.filter(d=>d.projectId===p.id&&d.app===app).reduce((m,d)=>Math.max(m,Number(d.version)||0),0);
      const ref=await addDoc("designs",{projectId:p.id,app,name,notes,file:j.file,version:String(prev+1),status:"draft",visibility:"external",updatedAt:now(),by:S.me||""});
      S.dzup=null;S.dzsel=ref.id;toast("Prototype saved");render();
    }catch(err){t.disabled=false;$("#dzProg").textContent="";toast("Not saved: "+err.message)}}
});
/* boot */
let rq=0;function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;const ae=document.activeElement;const busy=document.querySelector("#mform,#dform,.lightbox,#docview iframe,#docup,#renDesc,#dzup")||(ae&&ae.closest&&(ae.closest(".pend")||ae.id==="cmtText"||ae.id==="meIn"))||(($("#cmtText")||{}).value||"").trim();if(!busy)render()})}
(async()=>{
  const c=window.claude;
  const db=c&&c.use?await c.use("db"):null;
  if(!db){$("#boot").textContent="Could not reach the Hub server.";return}
  S.db=db;
  if(window.HUB_IDENTITY){const id=window.HUB_IDENTITY;S.me=id.name||id.email||S.me;S.role=id.role||"hci";S.locked=true;if(S.role!=="hci"){S.scope="project";S.view="overview"}}
  c.use("downloads").then(x=>{S.dl=x;schedule()}).catch(()=>{});
  c.use("assets").then(x=>{S.assets=x;schedule()}).catch(()=>{});
  let got=0;const all=(1<<COLS.length)-1;
  COLS.forEach((col,i)=>{
    db.collection(col).onSnapshot(snap=>{
      S.cols[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      if(!S.ready){got|=1<<i;if(got===all){S.ready=true;render()}}else schedule();
    },err=>toast("Live updates stopped: "+err.code));
  });
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},7000);
})();
})();
</script>
